# JVM 内存给小项目就够了，给大是把 Gradle 喂成全屋卡顿
org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=false
android.nonTransitiveRClass=true

# Windows 上项目路径含非 ASCII 字符（典型：中文用户名）时，AGP 会直接拒绝构建：
#   "Your project path contains non-ASCII characters..."（b.android.com/95744）
# 开了这条才能在这种情况下编译。虽然 AGP 提示可能有别的问题，
# 但 tools/build_apk.py 会额外把工程复制到纯 ASCII 目录再编，双保险。
android.overridePathCheck=true
