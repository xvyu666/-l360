# 安卓 APK 签名配置（模板）
#
# 用法：
#   1. 复制这个文件，改名成 signing.properties（放在同一目录：android-relay/ 下）
#   2. 先跑 make-keystore.bat 生成 keystore.jks，再回来改下面的密码
#   3. 之后 assembleRelease 产出的就是你自己签名的正式包
#
# 不做也可以：没有这个文件的话，构建脚本会自动退回 debug 签名，
# 产出的 APK 一样能装到手机上（只是包名不归你所有，也不能上架应用商店）。
#
# ⚠️ signing.properties 和 keystore.jks 都已在 .gitignore 里，不会被提交到 GitHub。
#    keystore 一旦丢了，就没法给同一个 APP 出升级包（只能让用户卸载重装）。

RELEASE_STORE_FILE=keystore.jks
RELEASE_STORE_PASSWORD=改成你的密码
RELEASE_KEY_ALIAS=printrelay
RELEASE_KEY_PASSWORD=改成你的密码
