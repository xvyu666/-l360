plugins {
    id 'com.android.application'
}

// ---- 签名开关 ----
// 配了署名文件（android-relay/signing.properties）就用正式签名；没配就退回 debug 签名。
//
// 为什么要绕这一下：AGP 里 signingConfig 为空时，assembleRelease 产出的是
// app-release-unsigned.apk —— 手机上根本装不了。回落之后，
// 「任何一个能敲 gradle 的人」都能拿到装得上的包，而不是一份废品。
//
// 注意这里全用「方法」而不是顶层 def 变量：Groovy 的方法体访问不到
// script body 里的 def 局部变量，写成 `def signingPropsFile = ...` 会让
// loadSigningProps() 报 "Could not get unknown property 'signingPropsFile'"。
File signingPropsFile() {
    return rootProject.file("signing.properties")
}

Properties loadSigningProps() {
    File f = signingPropsFile()
    if (!f.canRead()) return null
    Properties p = new Properties()
    f.withInputStream { p.load(it) }
    return p
}

boolean hasSigningProps() {
    Properties p = loadSigningProps()
    if (p == null || !p.containsKey("RELEASE_STORE_FILE")) return false
    return rootProject.file(p["RELEASE_STORE_FILE"]).canRead()
}

android {
    namespace 'com.printinbox.relay'
    compileSdk 34

    defaultConfig {
        applicationId "com.printinbox.relay"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // release 只在真的配了 keystore 时才创建，别占着一份空签名配置
        if (hasSigningProps()) {
            Properties p = loadSigningProps()
            // 先在闭包外面把值取出来：闭包里再解 rootProject / p 容易踩解析策略的坑，
            // 而局部变量是稳稳能被闭包捕获的
            File ks = rootProject.file(p["RELEASE_STORE_FILE"])
            String storePass = p["RELEASE_STORE_PASSWORD"]
            String alias = p["RELEASE_KEY_ALIAS"]
            String keyPass = p["RELEASE_KEY_PASSWORD"]
            release {
                storeFile ks
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            // 刻意不加 applicationIdSuffix：debug / release 共用一个包名，
            // 手机上不会同时装出两个「打印中转」
        }
        release {
            minifyEnabled false
            signingConfig hasSigningProps() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // 本项目刻意只用系统原生 API（不引 AndroidX），还要兼容到 minSdk 21，
        // lint 会出一堆 NewApi / Deprecation 提示。它们只是警告，
        // 但 assembleRelease 会跑 lintVital，为这些把构建卡红没必要。
        abortOnError false
        checkReleaseBuilds false
    }
}

// 刻意零第三方依赖：连 okhttp 都不用，上传走 HttpURLConnection。
// 这样项目离线也能编译，也不会因为依赖升级而坏。
dependencies {
}
